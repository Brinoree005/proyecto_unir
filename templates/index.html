<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIR S.A. - Facturación</title>
    <!-- Tailwind CSS para el diseño oscuro y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen">
    
    <header class="bg-slate-800 p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold text-sky-400">⚡💧 UNIR S.A.</h1>
        <p class="text-slate-400">Sistema de Gestión y Facturación SaaS</p>
    </header>

    <!-- Contenedor principal: 1 columna en móvil, 2 en PC -->
    <main class="max-w-6xl mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Panel Izquierdo: Formulario -->
        <div class="bg-slate-800 p-6 rounded-lg shadow-lg md:col-span-1">
            <h2 class="text-xl font-bold text-sky-400 mb-4">Ingresar Datos</h2>
            
            {% if error %}
            <div class="bg-red-500/20 border border-red-500 text-red-300 p-2 rounded mb-4 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/">
                <div class="mb-4">
                    <label class="block text-slate-400 mb-1">Nombre</label>
                    <input type="text" name="nombre" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-500">
                </div>
                
                <div class="mb-4">
                    <label class="block text-slate-400 mb-1">Referencia</label>
                    <input type="text" name="referencia" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-500">
                </div>

                <div class="mb-4">
                    <label class="block text-slate-400 mb-1">Servicio</label>
                    <select name="servicio" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-500">
                        <option value="Agua">💧 Agua (${{ t_agua }}/m³)</option>
                        <option value="Energía">⚡ Energía (${{ t_energia }}/kWh)</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-slate-400 mb-1">Consumo</label>
                    <!-- type="number" y step="any" abren el teclado numérico en celulares -->
                    <input type="number" step="any" name="consumo" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-500">
                </div>

                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-900 font-bold py-2 px-4 rounded mb-2 transition">Guardar y Calcular</button>
                <a href="/limpiar" class="block text-center w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded transition">Limpiar Tabla</a>
            </form>
        </div>

        <!-- Panel Derecho: Tabla de Resultados -->
        <div class="bg-slate-800 p-6 rounded-lg shadow-lg md:col-span-2 overflow-x-auto">
            <h2 class="text-xl font-bold text-sky-400 mb-4">Registros Generados</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-700 text-slate-400
